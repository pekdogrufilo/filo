<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belge — PEKDOĞRU Filo</title>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  #bosMesaj{font-family:-apple-system,'Segoe UI',Arial,sans-serif;color:#333;text-align:center;padding:60px 24px;font-size:15px;line-height:1.6;}
  #bosMesaj button{margin-top:14px;background:#00A389;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div id="belgeAlani"></div>
<div id="bosMesaj" style="display:none;">Açılacak belge bulunamadı.<br>Panelde belgeyi yeniden oluşturup tekrar dokunun.<br><button onclick="location.reload()">Yeniden Yükle</button></div>
<script>
/* v.358: Panel, belgeyi bu sayfayı açarak gösterir (bkz. app.js belgeYeniSekmedeAc).
   Belge HTML'i localStorage üzerinden taşınır; gerçek sayfa URL'i olduğu için iPad
   Safari'de sekme KALICI açılır (blob: linklerinin aksine) ve bir kez açılan sekme,
   paneldeki akış yarımda kalsa bile yerinde durur. */
(function(){
  var kayit=null;
  try{ kayit=JSON.parse(localStorage.getItem('filoBelgePaylasim')||'null'); }catch(e){}
  var alan=document.getElementById('belgeAlani'), bos=document.getElementById('bosMesaj');
  if(!kayit||!kayit.html){ bos.style.display='block'; return; }
  try{ if(kayit.ad) document.title=kayit.ad+' — PEKDOĞRU Filo'; }catch(e){}
  alan.innerHTML=kayit.html;
  /* innerHTML ile eklenen <script> etiketleri tarayıcı tarafından ÇALIŞTIRILMAZ —
     belgeye gömülü Yazdır/PDF çubuğunun çalışması için betikler yeniden oluşturulur. */
  var eski=alan.querySelectorAll('script');
  for(var i=0;i<eski.length;i++){
    var yeni=document.createElement('script');
    yeni.textContent=eski[i].textContent;
    eski[i].parentNode.replaceChild(yeni,eski[i]);
  }
})();
</script>
</body>
</html>
