<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pekdoğru Filo Yönetimi v19.4</title>
  
  <!-- PWA & Manifest Ayarları -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0c0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- CSS Dosyaları / Stiller -->
  <link rel="stylesheet" href="style.css?v=19.4">
  
  <style>
    /* CSS Değişkenleri ve Temel Ayarlar */
    :root {
      --bg: #0b0c0e;
      --surface: #141619;
      --surface-glass: rgba(20, 22, 25, 0.85);
      --border: #22262b;
      --text-1: #f1f5f9;
      --text-2: #94a3b8;
      --accent-blue: #2563eb;
      --accent-hover: #1d4ed8;
      --red: #e1555e;
      --green: #22c55e;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html[data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-glass: rgba(255, 255, 255, 0.85);
      --border: #e2e8f0;
      --text-1: #0f172a;
      --text-2: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-1);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .app-layout {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* Masaüstü Yan Menü (Sidebar) */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand h2 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .version-tag {
      background: rgba(37, 99, 235, 0.15);
      color: var(--accent-blue);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .sidebar-nav {
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      color: var(--text-2);
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.15s ease;
    }

    .nav-link:hover, .nav-link.active {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-1);
    }

    .nav-link.active {
      color: var(--accent-blue);
      font-weight: 600;
    }

    /* Ana İçerik Alanı */
    .main-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .top-header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .wrap {
      padding: 24px;
      flex: 1;
    }

    /* Mobil Alt Gezinti Çubuğu (Bottom Nav) */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 12, 14, 0.97);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 45;
      padding: 6px 0 max(6px, env(safe-area-inset-bottom));
    }

    html[data-theme="light"] .bottom-nav {
      background: rgba(255, 255, 255, 0.95);
      border-top-color: var(--border);
    }

    .bottom-nav-items {
      display: flex;
      align-items: center;
      justify-content: space-around;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .bottom-nav-items::-webkit-scrollbar {
      display: none;
    }

    .bn-item {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 2px;
      border: none;
      background: none;
      color: var(--text-2);
      font-size: 10px;
      font-family: var(--font-ui);
      font-weight: 500;
      cursor: pointer;
      position: relative;
      transition: color 0.15s ease, transform 0.1s ease;
    }

    .bn-item svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .bn-item:active svg {
      transform: scale(0.92);
    }

    .bn-item.active {
      color: var(--accent-blue);
      font-weight: 700;
    }

    .bn-badge {
      position: absolute;
      top: 3px;
      right: calc(50% - 16px);
      background: var(--red);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      min-width: 15px;
      height: 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      box-shadow: 0 2px 6px rgba(225, 85, 78, 0.4);
    }

    /* Responsive Medya Sorguları */
    @media (max-width: 900px) {
      .sidebar {
        display: none !important;
      }

      .bottom-nav {
        display: block;
      }

      .main-area {
        padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
      }

      .wrap {
        padding: 16px 14px 80px;
      }

      .top-header {
        padding: 10px 14px;
      }
    }

    /* Modal & Çekmece Katman Düzeltmeleri */
    .bn-sheet-container {
      position: fixed;
      inset: 0;
      z-index: 55;
      display: flex;
      align-items: flex-end;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <!-- Uygulama Genel Düzeni -->
  <div id="app" class="app-layout">
    
    <!-- Masaüstü Sol Yan Menü -->
    <aside class="sidebar">
      <div class="brand">
        <h2>PEKDOĞRU FİLO</h2>
        <span class="version-tag">v19.4</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#vehicles" class="nav-link active" onclick="switchTab('vehicles')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C1.4 11.2 1 12.1 1 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
          <span>Araç Filosu</span>
        </a>
        <a href="#contracts" class="nav-link" onclick="switchTab('contracts')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>Sözleşmeler</span>
        </a>
        <a href="#maintenance" class="nav-link" onclick="switchTab('maintenance')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span>Bakım & Onarım</span>
        </a>
      </nav>
    </aside>

    <!-- Ana İçerik Gövdesi -->
    <main class="main-area">
      <header class="top-header">
        <h1 id="pageTitle">Araç Yönetim Paneli</h1>
        <div class="user-profile">
          <span id="userDisplayName">Pekdoğru Filo</span>
        </div>
      </header>

      <div class="wrap" id="mainContainer">
        <!-- Araç Ekleme, Listeleme ve Dinamik İçerik Buraya Yüklenir -->
      </div>
    </main>

    <!-- Mobil Alt Gezinti Menüsü (Bottom Nav) -->
    <nav class="bottom-nav">
      <div class="bottom-nav-items">
        <button class="bn-item active" onclick="switchTab('vehicles')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C1.4 11.2 1 12.1 1 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
          <span>Araçlar</span>
        </button>
        <button class="bn-item" onclick="switchTab('contracts')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>Sözleşmeler</span>
        </button>
        <button class="bn-item" onclick="switchTab('maintenance')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span>Bakım</span>
        </button>
      </div>
    </nav>

  </div>

  <!-- Javascript Kodları ve Service Worker Entegrasyonu -->
  <script src="app.js?v=19.4"></script>
  <script>
    // Tab Değiştirme Yardımcı Fonksiyonu
    function switchTab(tabName) {
      console.log('Sekme Değiştirildi:', tabName);
      document.querySelectorAll('.bn-item, .nav-link').forEach(el => el.classList.remove('active'));
      // İlgili butonu aktif yap
      event.currentTarget.classList.add('active');
    }

    // Service Worker (v19.4) Kaydı & Önbellek Yönetimi
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=19.4')
          .then((registration) => {
            console.log('SW v19.4 Başarıyla Çalışıyor, Kapsam:', registration.scope);
            
            // Yeni sürüm algılandığında sayfayı güncel tut
            registration.addEventListener('updatefound', () => {
              const installingWorker = registration.installing;
              installingWorker.addEventListener('statechange', () => {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('Yeni v19.4 güncellemesi algılandı. Sayfa yenileniyor...');
                  window.location.reload();
                }
              });
            });
          })
          .catch((error) => {
            console.error('Service Worker Kayıt Hatası:', error);
          });
      });
    }
  </script>
</body>
</html>
