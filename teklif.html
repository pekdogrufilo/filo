<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Araç Kiralama Teklifi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;margin:0;padding:0;}
  :root{--teal:#017F76;--teal-b:#00A99D;--ink:#0B2B28;--mut:#5E7370;--line:#DCE8E6;--tint:#F3FAF8;}
  body{font-family:'Inter',Arial,sans-serif;font-size:14px;line-height:1.6;color:var(--ink);background:#EEF3F2;padding:18px 12px 60px;}
  .sayfa{max-width:800px;margin:0 auto;background:#fff;border-radius:14px;padding:28px 26px 34px;box-shadow:0 8px 30px rgba(11,43,40,.10);}
  .mono{font-family:'IBM Plex Mono',Consolas,monospace;font-variant-numeric:tabular-nums;}
  .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding-bottom:15px;border-bottom:3px solid var(--teal);flex-wrap:wrap;}
  .mh-left{display:flex;align-items:center;gap:13px;}
  .mh-logo{width:56px;height:56px;border:1px solid var(--line);border-radius:12px;padding:6px;flex-shrink:0;background:#fff;}
  .mh-logo img{width:100%;height:100%;object-fit:contain;}
  .mh-name{font-family:'Inter',Arial,sans-serif;font-size:19px;font-weight:800;color:var(--ink);line-height:1.2;}
  .mh-tag{font-size:9.5px;font-weight:600;color:var(--teal);letter-spacing:1.6px;text-transform:uppercase;margin-top:3px;}
  .mh-meta{text-align:right;font-size:11px;color:var(--mut);line-height:1.9;}
  .mh-meta .no{font-family:'Inter',Arial,sans-serif;font-size:15px;font-weight:800;color:var(--ink);}
  .doc-title{margin:22px 0 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .doc-title .t{font-family:'Inter',Arial,sans-serif;font-size:22px;font-weight:800;letter-spacing:2px;text-transform:uppercase;}
  .doc-title .rule{flex:1;height:1px;background:var(--line);min-width:24px;}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:var(--teal);background:var(--tint);border:1px solid var(--line);border-radius:20px;padding:4px 12px;white-space:nowrap;}
  .meta{display:grid;grid-template-columns:1.35fr 1fr;gap:11px;margin-bottom:20px;}
  .mcard{border:1px solid var(--line);border-radius:12px;padding:13px 16px;background:var(--tint);}
  .mcard .l{font-size:8.5px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:1.2px;}
  .mcard .v{font-family:'Inter',Arial,sans-serif;font-size:15px;font-weight:700;margin-top:2px;line-height:1.35;}
  .mcard .satir{font-size:12px;color:var(--mut);margin-top:5px;display:flex;gap:7px;align-items:baseline;}
  .mcard .satir .sl{font-size:9px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.8px;min-width:52px;}
  .knye .satir{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px;}
  .knye .satir:last-child{border-bottom:none;}
  .knye .sl{font-size:9px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.8px;}
  .knye .sv{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .tscroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{background:#0B2B28;color:#fff;font-family:'Inter',Arial,sans-serif;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:10px 8px;text-align:left;white-space:nowrap;}
  th.r,td.r{text-align:right;} th.c,td.c{text-align:center;}
  td.r{white-space:nowrap;}
  tbody td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:nth-child(even) td{background:var(--tint);}
  td.donem{font-weight:700;color:var(--teal);}
  .tot{margin:15px 0 0 auto;width:min(340px,100%);}
  .tot-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px;border-bottom:1px dashed var(--line);font-size:13px;color:var(--mut);}
  .tot-row .mono{font-weight:600;color:var(--ink);}
  .tot-aylik{margin-top:10px;display:flex;justify-content:space-between;align-items:center;background:var(--tint);border:1px solid var(--line);border-left:4px solid var(--teal-b);border-radius:0 9px 9px 0;padding:9px 14px;font-size:13px;}
  .tot-aylik .mono{font-size:14.5px;font-weight:700;color:var(--ink);}
  .genel{margin-top:8px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,#0B2B28,#017F76);color:#fff;border-radius:11px;padding:12px 16px;font-family:'Inter',Arial,sans-serif;font-size:12.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
  .genel .mono{font-size:17px;letter-spacing:0;}
  .sec-baslik{font-family:'Inter',Arial,sans-serif;font-size:13px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;margin:26px 0 12px;display:flex;align-items:center;gap:10px;}
  .sec-baslik::before{content:'';width:22px;height:4px;background:var(--teal-b);border-radius:2px;}
  .sart{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);}
  .sart:last-child{border-bottom:none;}
  .s-no{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--teal-b);min-width:22px;padding-top:1px;}
  .s-b{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;}
  .s-v{font-size:12.5px;color:var(--mut);margin-top:2px;}
  .kabul{display:flex;gap:34px;margin-top:34px;}
  .kbox{flex:1;text-align:center;min-width:0;}
  .k-t{font-size:9.5px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:1px;}
  .k-n{font-family:'Inter',Arial,sans-serif;font-size:13px;font-weight:700;margin-top:2px;}
  .k-img{margin-top:10px;max-width:220px;max-height:90px;margin-left:auto;margin-right:auto;}
  .kline{border-top:1px solid #9AB0AD;margin-top:46px;padding-top:6px;font-size:10px;color:var(--mut);}
  .foot{margin-top:28px;border-top:1px solid var(--line);padding-top:10px;font-size:10.5px;color:#7A8A88;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .foot b{color:#4B6B67;}
  /* imza paneli */
  .imza-panel{border:2px dashed var(--teal-b);border-radius:12px;padding:14px;margin-top:26px;background:var(--tint);}
  .imza-panel h4{font-family:'Inter',Arial,sans-serif;font-size:14px;font-weight:800;color:var(--ink);margin-bottom:4px;}
  .imza-panel .ip-not{font-size:12px;color:var(--mut);margin-bottom:10px;}
  .imza-cv{width:100%;height:150px;background:#fff;border:1px solid var(--line);border-radius:9px;touch-action:none;cursor:crosshair;display:block;}
  .imza-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .btn{border:none;border-radius:9px;padding:10px 18px;font-family:'Inter',Arial,sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-ana{background:linear-gradient(120deg,#00A99D,#017F76);color:#fff;flex:1;min-width:200px;}
  .btn-yan{background:var(--surface,#fff);border:1px solid var(--line);color:var(--mut);}
  .uyari{background:rgba(225,85,78,.08);border:1px solid rgba(225,85,78,.3);color:#B23A34;border-radius:10px;padding:14px 16px;font-size:13.5px;max-width:560px;margin:0 auto;}
  @media (max-width:620px){
    body{padding:12px 8px 48px;}
    .sayfa{padding:20px 14px 26px;border-radius:12px;max-width:100%;}
    .masthead{align-items:flex-start;}
    .mh-left{min-width:0;flex:1;}
    .mh-logo{width:46px;height:46px;}
    .mh-name{font-size:16.5px;overflow-wrap:anywhere;}
    .mh-meta{text-align:left;width:100%;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
    .doc-title .t{font-size:18px;letter-spacing:1.2px;}
    .meta{grid-template-columns:1fr;gap:9px;}
    .mcard{padding:11px 13px;min-width:0;}
    .mcard .v{font-size:14px;overflow-wrap:anywhere;}
    .mcard .satir{flex-wrap:wrap;}
    .knye .satir{font-size:11.5px;gap:8px;}
    .knye .sv{max-width:62%;text-align:right;overflow-wrap:anywhere;}
    table{font-size:11.5px;}
    thead th{font-size:8.5px;padding:8px 6px;letter-spacing:.6px;}
    tbody td{padding:8px 6px;}
    .tot{width:100%;}
    .genel{font-size:11px;padding:11px 14px;}
    .genel .mono{font-size:15px;}
    .imza-cv{height:130px;}
    .kabul{gap:20px;flex-wrap:wrap;}
  }
  @media print{
    body{background:#fff;padding:0;font-size:12px;}
    .sayfa{box-shadow:none;border-radius:0;max-width:none;padding:8px 4px;}
    .imza-panel,.no-print{display:none !important;}
    @page{margin:14mm;}
  }
</style>
</head>
<body>
<div class="sayfa" id="doc"></div>
<div class="sayfa no-print" id="hata" style="display:none;"><div class="uyari">Teklif görüntülenemedi — bağlantı eksik veya bozuk görünüyor. Lütfen size gönderilen bağlantının tamamını kopyaladığınızdan emin olun.</div></div>
<script>
(function(){
  'use strict';
  var P = null;
  try{
    var m = location.hash.match(/d=([A-Za-z0-9\-_]+)/);
    if(!m) throw 0;
    var b64 = m[1].replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length % 4) b64 += '=';
    P = JSON.parse(decodeURIComponent(escape(atob(b64))));
  }catch(e){ P = null; }
  if(!P || !P.kalemler){ document.getElementById('doc').style.display='none'; document.getElementById('hata').style.display='block'; return; }

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function tl(n){ n = Number(n)||0; return n.toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' ₺'; }
  function satirToplam(k){ return (Number(k.adet)||0)*(Number(k.aylikKira)||0)*(Number(k.sureAy)||0); }
  var ara = P.kalemler.reduce(function(t,k){ return t + satirToplam(k); }, 0);
  var oran = Number(P.kdvOrani)||0, kdv = 0, genel = ara;
  if(P.kdvMod==='haric' && oran>0){ kdv = ara*oran/100; genel = ara + kdv; }
  var aylik = P.kalemler.reduce(function(a,k){ return a + (Number(k.adet)||0)*(Number(k.aylikKira)||0); }, 0);
  var toplamAdet = P.kalemler.reduce(function(a,k){ return a + (Number(k.adet)||0); }, 0);

  var kdvHtml = P.kdvMod==='haric'
    ? '<div class="tot-row"><span>Ara Toplam</span><span class="mono">'+tl(ara)+'</span></div>'
      + '<div class="tot-row"><span>KDV (%'+oran+')</span><span class="mono">'+tl(kdv)+'</span></div>'
    : '';
  var sartlar = [
    ['Geçerlilik', 'Bu teklif '+esc(P.tarih||'')+' tarihi itibarıyla '+esc(String(P.gecerlilik||15))+' gün geçerlidir.'],
    ['Ödeme', esc(P.odeme||'Aylık dönemler halinde peşin ödeme.')]
  ];
  if(P.kdvMod==='haric') sartlar.push(['Vergi','Fiyatlara KDV (%'+oran+') dahil değildir; genel toplama eklenmiştir.']);
  else if(P.kdvMod==='dahil') sartlar.push(['Vergi','Fiyatlara KDV (%'+oran+') dahildir.']);
  sartlar.push(['Kilometre', P.kalemler.some(function(k){return k.kmLimiti;})
    ? 'Kalemlerde belirtilen aylık km kullanımı dahildir; aşım halinde km başına belirtilen aşım bedeli uygulanır.'
    : 'Aylık km kullanımı sınırsızdır.']);
  sartlar.push(['Sigorta & Bakım', esc(P.notlar||'Araçlar kasko, trafik sigortası ve periyodik bakım dahil teslim edilir. Yakıt giderleri kiracıya aittir.')]);
  var sartlarHtml = sartlar.map(function(x,i){
    return '<div class="sart"><div class="s-no">'+String(i+1).padStart(2,'0')+'</div><div><div class="s-b">'+x[0]+'</div><div class="s-v">'+x[1]+'</div></div></div>';
  }).join('');

  var satirlar = P.kalemler.map(function(k){
    return '<tr>'
      + '<td><b>'+esc(k.ad||'—')+'</b></td>'
      + '<td class="c">'+(k.adet!=null?esc(k.adet):'—')+'</td>'
      + '<td class="r mono">'+tl(k.aylikKira||0)+'</td>'
      + '<td class="c">'+(k.sureAy!=null?esc(k.sureAy)+' ay':'—')+'</td>'
      + '<td class="r mono">'+(k.kmLimiti?Number(k.kmLimiti).toLocaleString('tr-TR'):'Sınırsız')+'</td>'
      + '<td class="r mono">'+(k.kmAsim?tl(k.kmAsim).replace(' ₺',' ₺/km'):'—')+'</td>'
      + '<td class="r mono donem">'+tl(satirToplam(k))+'</td>'
      + '</tr>';
  }).join('');

  var M = P.musteri||{};
  document.getElementById('doc').innerHTML =
    '<div class="masthead">'
      + '<div class="mh-left"><div class="mh-logo"><img src="./logo.png" alt="" onerror="this.parentNode.style.display=\'none\'"></div>'
      + '<div><div class="mh-name">'+esc((P.firma&&P.firma.kisa)||'PEKDOĞRU OTOMOTİV TURİZM')+'</div>'
      + '<div class="mh-tag">Araç Kiralama &amp; Filo Çözümleri</div></div></div>'
      + '<div class="mh-meta"><span class="no">'+esc(P.tkNo||'')+'</span><br>'+esc(P.tarih||'')+'<br>Geçerlilik: '+esc(String(P.gecerlilik||15))+' gün</div>'
    + '</div>'
    + '<div class="doc-title"><span class="t">Araç Kiralama Teklifi</span>'
      + (toplamAdet?'<span class="chip">'+toplamAdet+' Araç</span>':'') + '<span class="rule"></span></div>'
    + '<div class="meta">'
      + '<div class="mcard"><div class="l">Sayın</div><div class="v">'+esc(M.ad||'—')+'</div>'
        + (M.sehir?'<div class="satir"><span class="sl">Şehir</span><span>'+esc(M.sehir)+'</span></div>':'')
        + (M.telefon?'<div class="satir"><span class="sl">Telefon</span><span class="mono">'+esc(M.telefon)+'</span></div>':'')
        + (M.email?'<div class="satir"><span class="sl">E-posta</span><span>'+esc(M.email)+'</span></div>':'')
      + '</div>'
      + '<div class="mcard knye">'
        + '<div class="satir"><span class="sl">Teklif No</span><span class="sv">'+esc(P.tkNo||'—')+'</span></div>'
        + '<div class="satir"><span class="sl">Tarih</span><span class="sv">'+esc(P.tarih||'—')+'</span></div>'
        + '<div class="satir"><span class="sl">Para Birimi</span><span class="sv">TL (₺)</span></div>'
        + '<div class="satir"><span class="sl">KDV</span><span class="sv">'+(P.kdvMod==='haric'?'Hariç (%'+oran+')':P.kdvMod==='dahil'?'Dahil (%'+oran+')':'Yok')+'</span></div>'
      + '</div>'
    + '</div>'
    + '<div class="tscroll"><table><thead><tr><th>Araç / Hizmet</th><th class="c">Adet</th><th class="r">Aylık Kira</th><th class="c">Süre</th><th class="r">Aylık KM</th><th class="r">KM Aşımı</th><th class="r">Dönem Toplamı</th></tr></thead>'
    + '<tbody>'+satirlar+'</tbody></table></div>'
    + '<div class="tot">'+kdvHtml
      + (aylik?'<div class="tot-aylik"><span>Aylık Toplam Kira</span><span class="mono">'+tl(aylik)+'</span></div>':'')
      + '<div class="genel"><span>'+(P.kdvMod==='haric'?'Genel Toplam · KDV Dahil':'Genel Toplam')+'</span><span class="mono">'+tl(genel)+'</span></div>'
    + '</div>'
    + '<div class="sec-baslik">Teklif Şartları</div>' + sartlarHtml
    + '<div class="kabul">'
      + '<div class="kbox"><div class="k-t">Hazırlayan / Yetkili</div><div class="k-n">'+esc((P.firma&&P.firma.kisa)||'')+'</div><div class="kline">İmza</div></div>'
      + '<div class="kbox"><div class="k-t">Kabul ve Onay</div><div class="k-n">'+esc(M.ad||'Müşteri')+'</div><div id="musteriImzaAlani"></div><div class="kline">İmza / Kaşe</div></div>'
    + '</div>'
    + '<div class="foot"><span><b>'+esc((P.firma&&P.firma.tam)||'')+'</b></span><span>'+esc(P.tkNo||'')+' · Araç Kiralama Teklifi · '+esc(P.tarih||'')+'</span></div>'
    + '<div class="imza-panel no-print" id="imzaPanel">'
      + '<h4>Müşteri İmzası</h4>'
      + '<div class="ip-not">Teklifi kabul ediyorsanız kutucuğa parmağınızla veya faresiyle imzanızı atın, ardından "İmzalı Teklifi PDF Olarak Kaydet" düğmesine basıp çıkan belgeyi bize WhatsApp\'tan geri gönderebilirsiniz.</div>'
      + '<canvas class="imza-cv" id="imzaCv"></canvas>'
      + '<div class="imza-btns">'
        + '<button class="btn btn-ana" onclick="pdfKaydet()">İmzalı Teklifi PDF Olarak Kaydet</button>'
        + '<button class="btn btn-yan" onclick="imzaTemizle()">İmzayı Temizle</button>'
      + '</div>'
    + '</div>';

  // — imza tuvali —
  var cv = document.getElementById('imzaCv'), ctx = cv.getContext('2d'), ciziyor = false;
  function boyutla(){
    var r = cv.getBoundingClientRect(), d = window.devicePixelRatio||1;
    var data = cv.toDataURL();
    cv.width = r.width*d; cv.height = r.height*d;
    ctx.scale(d,d); ctx.lineWidth = 2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle = '#0B2B28';
    var img = new Image();
    img.onload = function(){ ctx.drawImage(img,0,0,r.width,r.height); };
    img.src = data;
  }
  boyutla(); window.addEventListener('resize', boyutla);
  function konum(e){ var r = cv.getBoundingClientRect(); var t = e.touches ? e.touches[0] : e; return [t.clientX-r.left, t.clientY-r.top]; }
  function basla(e){ e.preventDefault(); ciziyor = true; var p = konum(e); ctx.beginPath(); ctx.moveTo(p[0],p[1]); }
  function ciz(e){ if(!ciziyor) return; e.preventDefault(); var p = konum(e); ctx.lineTo(p[0],p[1]); ctx.stroke(); }
  function bitir(){ ciziyor = false; }
  cv.addEventListener('mousedown',basla); cv.addEventListener('mousemove',ciz); window.addEventListener('mouseup',bitir);
  cv.addEventListener('touchstart',basla,{passive:false}); cv.addEventListener('touchmove',ciz,{passive:false}); window.addEventListener('touchend',bitir);
  window.imzaTemizle = function(){ ctx.clearRect(0,0,cv.width,cv.height); document.getElementById('musteriImzaAlani').innerHTML = ''; };
  window.pdfKaydet = function(){
    var bos = !ctx || cv.toDataURL().length < 400;
    if(bos){ if(!confirm('İmza kutusu boş görünüyor. İmzasız kaydetmek istiyor musunuz?')) return; }
    else document.getElementById('musteriImzaAlani').innerHTML = '<img class="k-img" alt="Müşteri imzası" src="'+cv.toDataURL()+'">';
    window.print();
  };
})();
</script>
</body>
</html>
